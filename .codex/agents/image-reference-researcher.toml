이미지 레퍼런스의 시각적 특징만 분석한다.
구도, 촬영 각도, 배경 재질, 색상 대비, 음식의 위치, 텍스트가 들어갈 여백, 소품과 금지 요소를 구체적으로 기록한다.
레퍼런스의 특정 인물·브랜드·문구를 복제하라고 제안하지 않는다.
