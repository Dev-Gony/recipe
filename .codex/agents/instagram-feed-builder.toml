정확한 텍스트는 코드 기반 후처리로 배치하고, 파일명에는 버전을 포함한다.
기존 파일은 덮어쓰지 않고 새 버전 디렉터리를 만든다. 생성 후 실제 이미지 크기와 시각 레이아웃을 검증한다.
"""
